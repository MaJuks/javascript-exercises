<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="https://www.freepnglogos.com/uploads/corac-o-rosa-png/corac-o-rosa-contorno-transparente-baixar-hd-7.png" type="image/x-icon">
    <link rel="stylesheet" href="estilos.css">
    <title>Consultório odontológico</title>
  </head>

  <body>
    <h1>Clínica de odonto - Maju </h1>
    <img src="icon-medico.png" alt="Jogo dos Números" class="normal">
    <form>
      <p>
        Nome do paciente:
        <input type="text" id="inPaciente" required autofocus/>
        <input type="submit" value="Adicionar" />
        <input type="button" value="Urgência" id="btnUrgencia" />
        <input type="button" value="Atender" id="btnAtender" />
      </p>
    </form>

    <h3>
      Em atendimento:
      <pre id="respLista"></pre>
    </h3>

    <script src="consultorio.js"></script>
  </body>
</html>
